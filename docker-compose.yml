services:
  backend:
    build: .
    ports:
      - "8000:8000"
  nix:
    image: nixos/nix:latest
    container_name: nix-shell
    stdin_open: true
    tty: true
    working_dir: /work
    volumes:
      - .:/work
      - nix-store:/nix
    # Linux: make host.docker.internal work
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Django will use these
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: "5432"
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    command: bash

volumes:
  nix-store:
