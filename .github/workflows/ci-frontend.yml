name: Frontend Coverage

on:
  pull_request:
    paths:
      - "flax-10-project-files/frontend/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  frontend-coverage:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flax-10-project-files/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: flax-10-project-files/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests with coverage
        run: |
          npm run test -- --run
          npm run coverage-report-clover

      - name: Post frontend coverage report as PR comment
        working-directory: flax-10-project-files/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERAGE_XML_PATH: ../frontend/coverage/clover.xml
          PATH_TRIM_ANCHOR: frontend/src
        run: |
          python frontend_coverage_commentor.py