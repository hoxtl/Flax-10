name: CI

on:
    push:
        branches:
            - "**"
    pull_requests:
        branches:
            - "**"

permissions:
    contents: read
    pull-requests: write
    checks: write
    
jobs:
    coverage:
        name: Backend Coverage Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
            
            - name: Setup Python Environment
              uses: actions/setup-python@v5
              with:
                python-version: "3.14"
                cache: "pip"
                cache-dependency-path: "requirements.txt"
            
            - name: Install dependencies
               run: |
                python -m pip Install
                pip install -r requirements.txt
                
            - name: Run Coverage Test
               run: | 
                python -m coverage erase
                python -m coverage run manage.py test
                python -m coverage report -m
            
            - name: Generate XML and HTML coverage
                run: |
                    python -m coverage html
                    python -m coverage xml
            
            - name: Upload coverage report artifact
              uses: actions/upload-artifact@v4
              with: 
                name: index
                path: flax-10-project-files/backend/htmlcov/
                
            - name: Post coverage report as comment
              uses: MishaKav/pytest-coverage-comment@v1.1.47
              with:
                github-token: ${{ secrets.GITHUB_TOKEN }}
                pytest-xml-coverage-path: flax-10-project-files/backend/coverage.xml