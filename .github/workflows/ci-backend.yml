name: CI Backend

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  coverage:
    name: Backend Coverage Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
        ports:
          - 5432:5432
        # Healthcheck so tests don't race Postgres startup
        options: >-
          --health-cmd="pg_isready -U user -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Run Coverage Test
        working-directory: flax-10-project-files/backend
        run: |
          python -m coverage erase
          python -m coverage run manage.py test
          python -m coverage report -m

      - name: Generate XML and HTML coverage
        working-directory: flax-10-project-files/backend
        run: |
          python -m coverage html
          python -m coverage xml

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: flax-10-project-files/backend/htmlcov/

      - name: Post coverage report as comment
        working-directory: flax-10-project-files/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERAGE_XML_PATH: ../backend/coverage.xml
        run: |
          python backend_coverage_commentor.py